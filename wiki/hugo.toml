defaultContentLanguage = 'ru'
baseUrl = 'https://ergowiki.azhidkov.pro'
title = 'Эргономичный подход'
theme = 'hugo-book'
enableGitInfo = true

[languages]
  [languages.ru]
    locale = 'ru-RU'
    direction = 'ltr'

[security]
  [security.exec]
    allow = ['^dart-sass-embedded$', '^go$', '^npx$', '^postcss$', 'asciidoctor', 'git']

[markup]
  [markup.asciidocExt]
    backend = 'html5'

[menu]
[[menu.after]]
  name = "Канал в Telegram"
  url = "https://t.me/ergonomic_code"
  weight = 10

[[menu.after]]
  name = "Канал в Max"
  url = "https://max.ru/id544512614458_biz"
  weight = 20

[params]
  custom_css = ["css/github.css"]
  images = [ 'logo.png' ]

  BookTheme = 'auto'
  BookToC = true
  BookRepo = 'https://github.com/ergonomic-code/ergo-wiki'
  BookCommitPath = 'commit'
  BookEditPath = 'edit/master'
  BookDateFormat = '02 January 2006'

# КБ и служебные страницы сайта сохраняют прежние URL.
[[module.mounts]]
source = '../kb'
target = 'content/docs'
files = ['! **/images/**']
[[module.mounts]]
source = 'content'
target = 'content'
[[module.mounts]]
source = '../kb/models/images'
target = 'static/docs/models/images'
[[module.mounts]]
source = '../kb/images'
target = 'static/docs/images'
[[module.mounts]]
source = '../kb/methodics/images'
target = 'static/docs/methodics/images'
[[module.mounts]]
source = 'static'
target = 'static'

[markup.asciidocExt.attributes]
relfilesuffix = '.adoc'
